<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#173d70"><title>My Hisab</title><style> *{box-sizing:border-box}body{margin:auto;max-width:650px;padding: max(42px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));font:16px system-ui;background:#f1f5f9;color:#17233b}h1{margin:8px 0}section{background:white;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0001}button,input,select{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0}button{background:#173d70;color:white;cursor:pointer}button.small{background:#edf2f7;color:#173d70;padding:7px;font-size:13px}input,select{width:100%}.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.line strong{flex:1}.money{font-size:24px;font-weight:bold}small{color:#64748b}.pos{color:#087b53}.neg{color:#b42318}details{margin:12px 0}summary{cursor:pointer;font-weight:bold}label{display:block;margin-top:8px}body{background:#eef3f8}h1{font-size:27px}section{box-shadow:0 2px 8px #152b4510}button{min-height:42px}button.small{min-height:36px}.balance{background:#f3f7fb;border:1px solid #dbe5ef;border-radius:16px;padding:16px;margin:16px 0}.balance .money{font-size:36px}.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.totals div{background:white;padding:10px;border-radius:10px}.totals strong{display:block;margin-top:5px}.entry{border-bottom:1px solid #e2e8f0;padding:14px 0}.entry:last-child{border:0}.entry .line{justify-content:space-between}.after{display:inline-block;background:#eef3f8;border-radius:8px;padding:5px 9px;margin:8px 0}.actions{display:flex;gap:6px;justify-content:flex-end}form button[type=submit]{width:100%}select{white-space:normal}h2{margin:14px 0} </style></head><body><h1>My Hisab</h1><small>Trips · Friends · Personal balances</small><div id=app></div><section><button onclick="backup()">Export backup</button> <button onclick="document.getElementById('restore').click()">Restore backup</button><input hidden type=file id=restore accept='.json' onchange="restoreFile(this)"><p><small>Data is saved on this device. Keep regular backups.</small></p></section><script>
let data=[];try{data=JSON.parse(localStorage.getItem('myhisab-v1')||'[]')}catch(e){};let ti=-1,fi=-1,editing=-1;const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), rs=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}), bal=f=>running(f,f.entries.length-1);const names={Paid:'Me friend ne paisa aapya',Expense:'Friend e mara mate kharcho karyo',Refund:'Friend e mane paisa pacha aapya'};const delta=e=>Math.round(e.amount*100)*(e.type==='Paid'?1:-1);const running=(f,i)=>f.entries.slice(0,i+1).reduce((a,e)=>a+delta(e),0)/100;const status=n=>n>0?'Friend pase mara jama':n<0?'Mare friend ne aapvana':'Hisab clear / Settled';const tone=n=>n>0?'pos':n<0?'neg':'';const total=(f,t)=>f.entries.filter(e=>e.type===t).reduce((a,e)=>a+Math.round(e.amount*100),0)/100;function save(){try{localStorage.setItem('myhisab-v1',JSON.stringify(data))}catch(e){alert('Storage unavailable. Export backup before closing.')}render()}function nameAsk(s){let n=prompt(s);return n&&n.trim()}function addTrip(){let n=nameAsk('Trip name');if(n){data.push({name:n,friends:[]});save()}}function addFriend(){let n=nameAsk('Friend name');if(n){data[ti].friends.push({name:n,entries:[]});save()}}function rename(kind){let o=kind==='trip'?data[ti]:data[ti].friends[fi];let n=prompt('Edit name',o.name);if(n&&n.trim()){o.name=n.trim();save()}}function del(kind,i){if(!confirm('Delete permanently?'))return;if(kind==='trip'){data.splice(ti,1);ti=fi=-1}else if(kind==='friend'){data[ti].friends.splice(fi,1);fi=-1}else{data[ti].friends[fi].entries.splice(i,1)}editing=-1;save()}function go(t,f=-1){ti=t;fi=f;editing=-1;render()}function edit(i){editing=i;render();$('type').scrollIntoView({block:'center'})}function submitEntry(e){e.preventDefault();let v={type:$('type').value,amount:Number($('amount').value),date:$('date').value,note:$('note').value};if(!Number.isFinite(v.amount)||v.amount<=0)return;let a=data[ti].friends[fi].entries;if(editing<0)a.push(v);else a[editing]=v;editing=-1;save()}function render(){let h='';if(ti<0){h='<section><h2>My trips</h2><button onclick="addTrip()">+ New trip</button>'+data.map((t,i)=>`<section onclick="go(${i})" style="cursor:pointer"><strong>${esc(t.name)}</strong><p>${t.friends.length} friends</p><small>Tap to open</small></section>`).join('')+'</section>'}else{let t=data[ti];h=`<button class=small onclick="go(-1)">← All trips</button><section><div class=line><strong>${esc(t.name)}</strong><button class=small onclick="rename('trip')">Edit</button><button class=small onclick="del('trip')">Delete</button></div>`;if(fi<0){h+=`<button onclick="addFriend()">+ Add friend</button>`+t.friends.map((f,i)=>`<section onclick="go(${ti},${i})" style="cursor:pointer"><strong>${esc(f.name)}</strong><div class="money ${bal(f)>=0?'pos':'neg'}">${rs(Math.abs(bal(f)))}</div><small>${status(bal(f))}</small></section>`).join('')}else{let f=t.friends[fi],v=f.entries[editing]||{type:'Paid',amount:'',date:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),note:''};h+=`<button class=small onclick="go(${ti})">← Friends</button><h2>${esc(f.name)}</h2><button class=small onclick="rename('friend')">Edit friend</button> <button class=small onclick="del('friend')">Delete friend</button><div class=balance><small>Current balance</small><div class="money ${tone(bal(f))}">${rs(Math.abs(bal(f)))}</div><strong>${status(bal(f))}</strong><div class=totals><div><small>Me aapela paisa</small><strong>${rs(total(f,'Paid'))}</strong></div><div><small>Mara total kharcha</small><strong>${rs(total(f,'Expense'))}</strong></div><div><small>Paisa pacha malya</small><strong>${rs(total(f,'Refund'))}</strong></div></div></div><form onsubmit="submitEntry(event)"><h3>${editing<0?'Add transaction':'Edit transaction'}</h3><label>Type</label><select id=type>${['Paid','Expense','Refund'].map(x=>`<option value="${x}" ${v.type===x?'selected':''}>${names[x]}</option>`).join('')}</select><small>Paisa aapya = plus. Kharcho ke paisa pacha malya = minus.</small><label>Amount (₹)</label><input id=amount type=number min=.01 step=.01 required value="${v.amount}"><label>Date</label><input id=date type=date required value="${esc(v.date)}"><label>Description</label><input id=note placeholder="Train ticket, food..." value="${esc(v.note)}"><button type=submit>Save transaction</button> ${editing>=0?'<button type=button onclick="edit(-1)">Cancel</button>':''}</form><h3>History</h3>`+f.entries.map((e,i)=>`<div class=entry><div class=line><strong>${esc(e.note||names[e.type])}</strong><b class="${e.type==='Paid'?'pos':'neg'}">${e.type==='Paid'?'+':'−'}${rs(e.amount)}</b></div><small>${esc(e.date)} · ${names[e.type]}</small><div><span class="after ${tone(running(f,i))}">${rs(Math.abs(running(f,i)))} · ${status(running(f,i))}</span></div><div class=actions><button class=small onclick="edit(${i})">Edit</button><button class=small onclick="del('entry',${i})">Delete</button></div></div>`).join('')}h+='</section>'}$('app').innerHTML=h}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='myhisab-backup.json';a.click()}async function restoreFile(input){try{let d=JSON.parse(await input.files[0].text());if(!Array.isArray(d)||!d.every(t=>typeof t.name==='string'&&Array.isArray(t.friends)&&t.friends.every(f=>typeof f.name==='string'&&Array.isArray(f.entries)&&f.entries.every(e=>['Paid','Expense','Refund'].includes(e.type)&&Number.isFinite(e.amount)&&e.amount>0&&typeof e.date==='string'&&typeof e.note==='string'))))throw Error();if(confirm('Replace all current data with backup?')){data=d;ti=fi=editing=-1;save()}}catch(e){alert('Invalid backup file')}input.value=''}render();</script></body></html>
